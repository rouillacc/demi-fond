            display: flex; flex-direction: column; justify-content: center; min-width: 0;
        }
        .slot.active {
            border-color: #f59e0b; background: #fffbeb;
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.28);
        }
        .slot.filled { border-style: solid; border-color: #3b82f6; background: #eff6ff; }
        .slot-role { font-size: 0.62rem; color: var(--muted); text-transform: uppercase; font-weight: 900; }
        .slot.active .slot-role { color: #d97706; }
        .slot-name { font-size: 0.82rem; font-weight: 900; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .slot-remove {
            position: absolute; top: -7px; right: -7px; width: 20px; height: 20px; border-radius: 50%;
            background: #ef4444; color: #fff; font-size: 0.68rem; font-weight: 900;
            display: none; align-items: center; justify-content: center; border: 2px solid #fff;
        }
        .slot.filled .slot-remove { display: flex; }

        .filter-bar {
            display: flex; gap: 6px; align-items: center; flex-shrink: 0; flex-wrap: wrap;
        }
        .filter-btn {
            padding: 5px 12px; border-radius: 999px; font-size: 0.78rem;
            background: var(--white); color: var(--muted); border: 2px solid #cbd5e1;
        }
        .filter-btn.active { background: #2563eb; color: #fff; border-color: #2563eb; }
        .hint-pill {
            margin-left: auto; font-size: 0.74rem; color: #1e293b; font-weight: 800;
            background: rgba(255,255,255,0.85); padding: 4px 10px; border-radius: 999px;
            border: 2px solid #e2e8f0;
        }

        .students-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr));
            gap: 8px; overflow-y: auto; padding: 6px 2px 16px 2px; flex: 1; min-height: 0;
            -webkit-overflow-scrolling: touch;
        }
        .student-card {
            background: var(--white); border: 3px solid #e2e8f0; border-radius: 14px;
            padding: 8px 6px; text-align: center; cursor: pointer; position: relative;
            display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 78px;
            box-shadow: 0 3px 0 #cbd5e1;
        }
        .student-card:active { transform: translateY(2px); box-shadow: 0 1px 0 #cbd5e1; }
        .student-card.selected { opacity: 0.55; border-style: dashed; border-color: #f59e0b; background: #fffbeb; }
        .student-card.done { border-color: #10b981; background: #ecfdf5; box-shadow: 0 3px 0 #6ee7b7; }
        .card-class {
            position: absolute; top: 0; right: 0; font-size: 0.6rem; font-weight: 900;
            padding: 2px 6px; border-bottom-left-radius: 7px; border-top-right-radius: 10px;
        }
        .c-5b { background: var(--c5b); color: #fff; }
        .c-5c { background: var(--c5c); color: #0f172a; }
        .card-sex {
            position: absolute; bottom: 4px; left: 5px; font-size: 0.66rem; font-weight: 900;
            padding: 2px 7px; border-radius: 6px;
        }
        .card-sex.sex-f { background: #fce7f3; color: #be185d; }
        .card-sex.sex-g { background: #dbeafe; color: #1d4ed8; }
        .card-badge {
            position: absolute; top: -9px; left: -5px; background: #f59e0b; color: #fff;
            font-size: 0.66rem; font-weight: 900; padding: 2px 7px; border-radius: 999px;
            border: 2px solid #fff;
        }
        .card-name { font-size: 0.9rem; font-weight: 900; color: var(--ink); line-height: 1.15; }
        .card-meta { font-size: 0.7rem; color: var(--muted); font-weight: 800; margin-top: 2px; }
        .card-note {
            font-size: 0.7rem; font-weight: 900; color: #047857; background: #d1fae5;
            padding: 1px 7px; border-radius: 999px; margin-top: 3px;
        }

        /* ================= ECRAN 2 : EVALUATION ================= */
        #screen-eval {
            display: none; flex-direction: column;
            height: 100dvh; width: 100%; padding: 6px 8px; gap: 6px; overflow: hidden;
        }
        .eval-header {
            display: flex; align-items: center; justify-content: space-between; gap: 8px;
            background: var(--white); border: 3px solid #93c5fd; border-radius: 14px;
            padding: 5px 8px; flex-shrink: 0; box-shadow: 0 3px 0 #bfdbfe;
        }
        .eval-nav-btns { display: flex; gap: 6px; flex-shrink: 0; }
        .runner-tabs { display: flex; gap: 6px; flex: 1; min-width: 0; }
        .runner-tab {
            flex: 1; min-width: 0; padding: 5px 10px; border-radius: 10px;
            background: #f1f5f9; color: var(--muted); border: 2px solid transparent;
            text-align: left; display: flex; justify-content: space-between; align-items: center; gap: 6px;
        }
        .runner-tab.active {
            background: #eff6ff; color: var(--ink); border-color: #3b82f6;
            box-shadow: 0 2px 0 #93c5fd;
        }
        .tab-info { min-width: 0; }
        .tab-main { font-size: 0.88rem; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .tab-sub { font-size: 0.68rem; color: var(--muted); font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .score-pill {
            background: linear-gradient(135deg, #10b981, #059669); color: #fff;
            border-radius: 12px; padding: 4px 12px; text-align: center; flex-shrink: 0;
            box-shadow: 0 3px 0 #047857;
        }
        .score-pill-val { font-family: &#x27;Fredoka&#x27;, sans-serif; font-size: 1.2rem; font-weight: 700; line-height: 1.05; }
        .score-pill-sub { font-size: 0.62rem; font-weight: 800; opacity: 0.95; }

        /* ONGLETS DE PHASE (VISIBLES SUR PORTABLE / PETIT ECRAN) */
        .phase-tabs {
            display: none; grid-template-columns: repeat(3, 1fr); gap: 6px; flex-shrink: 0;
        }
        .phase-tab {
            padding: 9px 6px; border-radius: 12px; font-family: &#x27;Fredoka&#x27;, sans-serif;
            font-size: 0.9rem; font-weight: 700; background: var(--white); color: var(--muted);
            border: 3px solid #cbd5e1; text-align: center;
        }
        .phase-tab.active-velo  { background: #10b981; color: #fff; border-color: #047857; }
        .phase-tab.active-moto  { background: #f43f5e; color: #fff; border-color: #be123c; }
        .phase-tab.active-bilan { background: #2563eb; color: #fff; border-color: #1e40af; }

        /* LAYOUT 3 COLONNES TABLETTE PAYSAGE */
        .eval-body {
            display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 0.95fr) minmax(0, 0.9fr);
            gap: 8px; flex: 1; min-height: 0; overflow: hidden;
        }
        .eval-col {
            position: relative; border-radius: 16px; padding: 8px 10px;
            display: flex; flex-direction: column; overflow: hidden; min-width: 0;
            box-shadow: 0 5px 0 rgba(15, 23, 42, 0.08);
        }
        .eval-col-content {
            position: relative; z-index: 2; display: flex; flex-direction: column;
            gap: 6px; flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
        }

        .bg-watermark {
            position: absolute; z-index: 0; pointer-events: none;
            right: -12px; bottom: 4px; width: 88%; max-width: 320px; opacity: 0.15;
            transform: rotate(-6deg);
        }

        .col-velo  { background: linear-gradient(180deg, #ecfdf5 0%, #bbf7d0 100%); border: 3px solid var(--velo-main); }
        .col-moto  { background: linear-gradient(180deg, #fff1f2 0%, #fecdd3 100%); border: 3px solid var(--moto-main); }
        .col-bilan { background: linear-gradient(180deg, #ffffff 0%, #dbeafe 100%); border: 3px solid var(--bilan-main); }

        .col-title {
            display: flex; justify-content: space-between; align-items: center; gap: 6px;
            font-family: &#x27;Fredoka&#x27;, sans-serif; font-size: clamp(0.92rem, 1.4vw, 1.1rem); font-weight: 700;
        }
        .avg-badge {
            font-family: &#x27;Fredoka&#x27;, sans-serif; font-size: 0.85rem; font-weight: 700;
            padding: 3px 10px; border-radius: 999px; color: #fff; white-space: nowrap;
        }
        .avg-velo { background: var(--velo-dark); }
        .avg-moto { background: var(--moto-dark); }

        .projet-row {
            display: flex; align-items: center; justify-content: space-between; gap: 6px;
            background: rgba(255,255,255,0.92); padding: 5px 8px; border-radius: 12px;
            border: 2px solid rgba(15,23,42,0.1);
        }
        .projet-row label { font-size: 0.8rem; font-weight: 900; color: #1e293b; }
        .vma-tag {
            font-size: 0.72rem; font-weight: 900; color: #047857; background: #d1fae5;
            padding: 2px 7px; border-radius: 999px; white-space: nowrap;
        }
        .num-input {
            width: 68px; padding: 4px; border-radius: 8px; border: 2px solid #3b82f6;
            background: #fff; color: var(--ink); font-size: 1rem; font-weight: 900; text-align: center;
        }

        /* PERIODES */
        .periods-grid-9 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
        .periods-grid-3 { display: grid; grid-template-columns: 1fr; gap: 6px; } /* 1 colonne large sur tablette = zéro débordement */

        .period-card {
            background: rgba(255, 255, 255, 0.92); border: 2px solid rgba(15, 23, 42, 0.12);
            border-radius: 12px; padding: 5px 7px; display: flex; flex-direction: column; gap: 4px;
            cursor: pointer; min-width: 0;
        }
        .period-card.active-velo {
            border-color: var(--velo-dark); background: #fff;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.32);
        }
        .period-card.active-moto {
            border-color: var(--moto-dark); background: #fff;
            box-shadow: 0 0 0 3px rgba(244, 63, 94, 0.32);
        }
        .period-head {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 0.74rem; font-weight: 900; color: var(--muted);
        }
        .period-card.active-velo .period-head { color: var(--velo-dark); }
        .period-card.active-moto .period-head { color: var(--moto-dark); }
        .period-controls { display: flex; align-items: center; justify-content: space-between; gap: 4px; }
        .btn-step {
            width: 32px; height: 32px; flex-shrink: 0; border-radius: 8px; background: #e2e8f0; color: var(--ink);
            font-size: 1.15rem; font-weight: 900; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 2px 0 #94a3b8;
        }
        .btn-step:active { box-shadow: none; }
        .period-val {
            flex: 1; min-width: 0; width: 100%; text-align: center; font-size: 1.1rem; font-weight: 900;
            background: #f8fafc; color: var(--ink); border: 2px solid #cbd5e1; border-radius: 8px; padding: 2px;
        }
        .pop-anim { animation: numPop 0.22s ease; }
        @keyframes numPop {
            0% { transform: scale(1); }
            50% { transform: scale(1.18); background: #fef08a; }
            100% { transform: scale(1); }
        }

        /* GROS BOUTON +1 PLOT */
        .big-plus-btn {
            width: 100%; padding: 12px 10px; border-radius: 14px;
            font-family: &#x27;Fredoka&#x27;, sans-serif; font-size: clamp(1rem, 1.6vw, 1.2rem); font-weight: 700;
            color: #fff; background: linear-gradient(180deg, #10b981, #059669);
            box-shadow: 0 5px 0 #047857; flex-shrink: 0;
        }
        .big-plus-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #047857; }
        .big-plus-btn.moto-btn {
            background: linear-gradient(180deg, #f43f5e, #e11d48);
            box-shadow: 0 5px 0 #9f1239;
        }
        .big-plus-btn.moto-btn:active { box-shadow: 0 1px 0 #9f1239; }

        /* TUILES BAS D&#x27;ECRAN */
        .stats-big {
            display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; margin-top: auto;
        }
        .stat-tile {
            background: rgba(255,255,255,0.94); border: 2px solid rgba(15,23,42,0.12); border-radius: 12px;
            padding: 6px 6px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center;
        }
        .stat-tile-lbl { font-size: 0.68rem; font-weight: 800; color: var(--muted); text-transform: uppercase; }
        .stat-tile-val { font-family: &#x27;Fredoka&#x27;, sans-serif; font-size: 1.1rem; font-weight: 700; color: var(--ink); line-height: 1.1; margin-top: 2px; }
        .stat-tile.good { border-color: #10b981; background: #ecfdf5; }
        .stat-tile.good .stat-tile-val { color: #047857; }
        .stat-tile.warn { border-color: #f59e0b; background: #fffbeb; }
        .stat-tile.warn .stat-tile-val { color: #b45309; }

        /* BANDEAU CONSEIL FIN DE 9&#x27; */
        .advice-banner {
            display: none; align-items: center; justify-content: space-between; gap: 6px;
            background: linear-gradient(135deg, #fef08a, #fde047);
            border: 2px solid #eab308; border-radius: 12px; padding: 6px 8px;
        }
        .advice-banner-txt { font-size: 0.74rem; font-weight: 900; color: #713f12; line-height: 1.2; }
        .advice-banner-btn {
            background: #b45309; color: #fff; padding: 5px 8px; border-radius: 8px;
            font-size: 0.72rem; flex-shrink: 0;
        }

        /* RECUPERATION INFO */
        .recup-info-card {
            background: linear-gradient(135deg, #fffbeb, #fef3c7);
            border: 2px solid #f59e0b; border-radius: 12px; padding: 7px 9px;
            display: flex; align-items: center; gap: 8px;
        }
        .recup-emoji { font-size: 1.6rem; line-height: 1; }
        .recup-info-title { font-family: &#x27;Fredoka&#x27;, sans-serif; font-size: 0.86rem; color: #b45309; }
        .recup-info-sub { font-size: 0.72rem; font-weight: 800; color: #78350f; line-height: 1.2; margin-top: 1px; }

        /* COLONNE 3 : POINTS */
        .criteria-list { display: flex; flex-direction: column; gap: 4px; font-size: 0.8rem; font-weight: 800; }
        .crit-row {
            display: flex; justify-content: space-between; align-items: center;
            background: #fff; padding: 5px 8px; border-radius: 10px; border: 2px solid #cbd5e1;
        }
        .crit-pts {
            font-family: &#x27;Fredoka&#x27;, sans-serif; font-weight: 700; color: #047857; background: #d1fae5;
            padding: 1px 8px; border-radius: 999px; font-size: 0.82rem; white-space: nowrap;
        }
        .crit-row.prof-row { border-color: #c4b5fd; background: #f5f3ff; }
        .crit-row.prof-row .crit-pts { color: #6d28d9; background: #ede9fe; }

        .tip-box {
            margin-top: auto; font-size: 0.76rem; font-weight: 800; color: #1e3a8a;
            background: #dbeafe; border: 2px solid #60a5fa; padding: 8px 10px; border-radius: 12px;
            line-height: 1.3;
        }

        /* MODALS */
        .modal-overlay {
            display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.78);
            z-index: 1000; align-items: center; justify-content: center; padding: 10px;
        }
        .modal-box {
            background: #fff; border: 4px solid #3b82f6; border-radius: 18px;
            width: 100%; max-width: 1120px; max-height: 92dvh; display: flex; flex-direction: column;
            overflow: hidden; box-shadow: 0 20px 45px rgba(0,0,0,0.35);
        }
        .modal-box-sm { max-width: 500px; border-color: #f59e0b; }
        .modal-head {
            padding: 10px 14px; background: #eff6ff; border-bottom: 2px solid #bfdbfe;
            display: flex; justify-content: space-between; align-items: center; gap: 8px;
        }
        .modal-box-sm .modal-head { background: #fffbeb; border-bottom-color: #fde68a; }
        .modal-head h2 { margin: 0; font-size: 1.05rem; color: #1d4ed8; }
        .modal-box-sm .modal-head h2 { color: #b45309; }
        .modal-body { padding: 12px; overflow: auto; flex: 1; -webkit-overflow-scrolling: touch; }
        .modal-foot {
            padding: 10px 14px; background: #f8fafc; border-top: 2px solid #e2e8f0;
            display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap;
        }

        .advice-modal-card {
            background: #f0fdf4; border: 3px solid #10b981; border-radius: 14px;
            padding: 12px; margin-bottom: 10px; font-size: 0.92rem; font-weight: 800; color: #064e3b; line-height: 1.4;
        }
        .advice-modal-target {
            background: #fff1f2; border: 3px solid #f43f5e; border-radius: 14px;
            padding: 12px; font-size: 0.95rem; font-weight: 900; color: #881337; line-height: 1.4;
        }

        table.bilan-table { width: 100%; border-collapse: collapse; font-size: 0.76rem; text-align: center; min-width: 680px; }
        table.bilan-table th {
            background: #1e3a8a; color: #fff; padding: 8px 4px; border: 1px solid #cbd5e1;
            position: sticky; top: 0; z-index: 2;
        }
        table.bilan-table td { padding: 6px 4px; border: 1px solid #e2e8f0; font-weight: 700; }
        table.bilan-table tr:nth-child(even) { background: #f8fafc; }
        .prof-btn {
            padding: 4px 7px; border-radius: 6px; font-size: 0.72rem; background: #e2e8f0; color: #334155; margin: 0 1px;
        }
        .prof-btn.active-r { background: #f59e0b; color: #fff; }
        .prof-btn.active-1 { background: #b45309; color: #fff; }
        .prof-btn.active-2 { background: #64748b; color: #fff; }
        .prof-btn.active-3 { background: #eab308; color: #0f172a; }

        /* ================= RESPONSIVE PORTABLE &amp; PETITE TABLETTE (&lt;= 860px) ================= */
        @media (max-width: 860px) {
            /* Accueil scrollable naturellement sur mobile */
            #screen-home { overflow-y: auto; -webkit-overflow-scrolling: touch; }
            .home-top { grid-template-columns: 1fr; }
            .slots-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .hint-pill { display: none; }
            .students-grid { overflow-y: visible; flex: none; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); }

            /* Header Eval sur 2 lignes propres */
            .eval-header { flex-wrap: wrap; gap: 6px; padding: 6px; }
            .eval-nav-btns { order: 1; }
            .score-pill { order: 2; padding: 4px 10px; }
            .runner-tabs { order: 3; flex-basis: 100%; }

            /* Onglets de phase activés : 1 seule colonne visible à la fois ! */
            .phase-tabs { display: grid; }
            .eval-body { display: flex; flex-direction: column; }
            .eval-col { display: none; flex: 1; min-height: 0; }
            .eval-col.mobile-active { display: flex; }

            /* Boutons encore plus grands au doigt sur téléphone */
            .btn-step { width: 38px; height: 38px; font-size: 1.3rem; }
            .period-val { font-size: 1.25rem; }
            .big-plus-btn { padding: 15px 12px; font-size: 1.25rem; }
            .crit-row { padding: 8px 10px; font-size: 0.9rem; }
        }

        /* ================= TABLETTE PAYSAGE COMPACTE (HAUTEUR &lt;= 620px) ================= */
        @media (min-width: 861px) and (max-height: 620px) {
            #screen-eval { padding: 5px 8px; gap: 5px; }
            .eval-header { padding: 4px 8px; }
            .eval-col { padding: 6px 8px; }
            .eval-col-content { gap: 4px; }
            .period-card { padding: 4px 6px; gap: 2px; }
            .btn-step { width: 28px; height: 28px; font-size: 1rem; }
            .period-val { font-size: 1rem; }
            .big-plus-btn { padding: 9px 8px; font-size: 1rem; }
            .stat-tile { padding: 4px; }
            .stat-tile-val { font-size: 1rem; }
            .crit-row { padding: 4px 7px; font-size: 0.74rem; }
            .tip-box { padding: 6px 8px; font-size: 0.7rem; }
        }
    &lt;/style&gt;

        // ================= CALCUL DU BAREME OFFICIEL (/16 AUTO + /4 PROF = /20) =================
        function calcScores(s) {
            const plots9 = s.plots9 || [0,0,0,0,0,0];
            const plots3 = s.plots3 || [0,0];
            const has9 = plots9.some(v =&gt; v &gt; 0);
            const finished9 = plots9.every(v =&gt; Number(v || 0) &gt; 0);
            const has3 = plots3.some(v =&gt; v &gt; 0);

            const sum9 = plots9.reduce((a,b) =&gt; a + Number(b || 0), 0);
            const vit9 = Math.round((sum9 / 6) * 10) / 10;

            const sum3 = plots3.reduce((a,b) =&gt; a + Number(b || 0), 0);
            const vit3 = Math.round((sum3 / 2) * 10) / 10;

            const p9 = parseFloat(s.p9);
            let ecart9 = null, noteEcart9 = 0;
            if (has9 &amp;&amp; !isNaN(p9) &amp;&amp; p9 &gt; 0) {
                ecart9 = Math.round(Math.abs(p9 - vit9) * 10) / 10;
                if (ecart9 &lt; 1) noteEcart9 = 1.5;
                else if (ecart9 &lt;= 1.5) noteEcart9 = 1;
                else noteEcart9 = 0.5;
            }

            let maxIdentical = 0;
            if (has9) {
                const counts = {};
                plots9.forEach(v =&gt; {
                    const n = Number(v || 0);
                    if (n &gt; 0) counts[n] = (counts[n] || 0) + 1;
                });
                const vals = Object.values(counts);
                maxIdentical = vals.length ? Math.max(...vals) : 0;
            }
            let noteReg9 = 0;
            if (maxIdentical &gt;= 5) noteReg9 = 3;
            else if (maxIdentical === 4) noteReg9 = 2;
            else if (maxIdentical === 3) noteReg9 = 1;

            const v9Round = Math.round(vit9);
            let notePerf9 = 0;
            if (has9) {
                const ref = s.sex === &#x27;F&#x27; ? v9Round + 1 : v9Round;
                if (ref &gt;= 13) notePerf9 = 4;
                else if (ref === 12) notePerf9 = 3.5;
                else if (ref === 11) notePerf9 = 3;
                else if (ref === 10) notePerf9 = 2.5;
                else if (ref === 9)  notePerf9 = 2;
                else if (ref === 8)  notePerf9 = 1.5;
                else if (ref === 7)  notePerf9 = 1;
                else notePerf9 = 0;
            }

            const p3 = parseFloat(s.p3);
            let ecart3 = null, noteEcart3 = 0;
            if (has3 &amp;&amp; !isNaN(p3) &amp;&amp; p3 &gt; 0) {
                ecart3 = Math.round(Math.abs(p3 - vit3) * 10) / 10;
                if (ecart3 &lt; 1) noteEcart3 = 1.5;
                else if (ecart3 &lt;= 1.5) noteEcart3 = 1;
                else noteEcart3 = 0.5;
            }

            const v3Round = Math.round(vit3);
            let notePerf3 = 0;
            if (has3) {
                const ref3 = s.sex === &#x27;F&#x27; ? v3Round + 1 : v3Round;
                if (ref3 &gt;= 14) notePerf3 = 4;
                else if (ref3 === 13) notePerf3 = 3.5;
                else if (ref3 === 12) notePerf3 = 3;
                else if (ref3 === 11) notePerf3 = 2.5;
                else if (ref3 === 10) notePerf3 = 2;
                else if (ref3 === 9)  notePerf3 = 1.5;
                else if (ref3 === 8)  notePerf3 = 1;
                else notePerf3 = 0;
            }

            let aug = null, noteAug = 0;
            if (has9 &amp;&amp; has3) {
                aug = Math.round((vit3 - vit9) * 10) / 10;
                if (aug &gt;= 1) noteAug = 2;
                else if (aug &gt;= 0.5) noteAug = 1;
                else noteAug = 0;
            }

            const total16 = Math.round((noteEcart9 + noteReg9 + notePerf9 + noteEcart3 + notePerf3 + noteAug) * 10) / 10;
            const hasRecup = (s.recup !== null &amp;&amp; s.recup !== undefined &amp;&amp; s.recup !== &#x27;&#x27;);
            const hasCoach = (s.coachNote !== null &amp;&amp; s.coachNote !== undefined &amp;&amp; s.coachNote !== &#x27;&#x27;);
            const profTotal = (hasRecup ? Number(s.recup) : 0) + (hasCoach ? Number(s.coachNote) : 0);
            const isComplete20 = hasRecup &amp;&amp; hasCoach;
            const total20 = isComplete20 ? Math.round((total16 + profTotal) * 10) / 10 : null;

            return {
                has9, finished9, has3,
                vit9, vit3, ecart9, ecart3, maxIdentical, aug,
                noteEcart9, noteReg9, notePerf9, noteEcart3, notePerf3, noteAug,
                total16, hasRecup, hasCoach, profTotal, isComplete20, total20
            };
        }

        // ================= CONSEIL PERSONNALISE FIN DE 9&#x27; =================
        function buildAdvice9(s, sc) {
            const target3 = Math.round((sc.vit9 + 1.0) * 2) / 2;
            const plotsTarget3 = Math.ceil(sc.vit9 + 1);
            const first2 = (Number(s.plots9[0]) + Number(s.plots9[1])) / 2;

            let msg9 = `🚲 &lt;strong&gt;Bilan 9&#x27; Vélo :&lt;/strong&gt; moyenne de &lt;strong&gt;${sc.vit9} km/h&lt;/strong&gt;.`;
            if (sc.maxIdentical &gt;= 5) {
                msg9 += `&lt;br&gt;🎯 &lt;strong&gt;Métronome !&lt;/strong&gt; Super régularité (${sc.maxIdentical}/6 périodes identiques = 3/3 pts).`;
            } else if (last2 &lt; first2 - 1) {
                msg9 += `&lt;br&gt;⚡ Tu es parti un peu vite au début. Profite bien des 6 min de récup active pour recharger les batteries !`;
            } else if (sc.ecart9 !== null &amp;&amp; sc.ecart9 &lt; 1) {
                msg9 += `&lt;br&gt;👏 &lt;strong&gt;Contrat respecté !&lt;/strong&gt; Ton projet 9&#x27; était très bien calibré.`;
            } else {
                msg9 += `&lt;br&gt;💪 Belle course ! Pense à bien marcher et souffler pendant la récupération.`;
            }

            const msg3 = `🏍️ &lt;strong&gt;Objectif pour la 3&#x27; Moto :&lt;/strong&gt;&lt;br&gt;Pour décrocher les &lt;strong&gt;2 points d&#x27;accélération&lt;/strong&gt;, tu dois dépasser &lt;strong&gt;${(sc.vit9 + 1).toFixed(1)} km/h&lt;/strong&gt; !&lt;br&gt;👉 Choisis un projet autour de &lt;strong&gt;${target3} km/h&lt;/strong&gt; et vise &lt;strong&gt;${plotsTarget3} plots&lt;/strong&gt; par période d&#x27;1&#x27;30.`;
            const shortTxt = `💡 Moy. 9&#x27; : ${sc.vit9} km/h → Vise ≥ ${(sc.vit9 + 1).toFixed(1)} km/h (${plotsTarget3} plots) !`;

            return { msg9, msg3, shortTxt };
        }

        // ================= ACCUEIL &amp; SELECTION =================
        function setClassFilter(f) {
            classFilter = f;
            [&#x27;ALL&#x27;,&#x27;5B&#x27;,&#x27;5C&#x27;].forEach(k =&gt; {

        function renderHome() {
            const grid = document.getElementById(&#x27;students-grid&#x27;);
            grid.innerHTML = &#x27;&#x27;;

            const list = students
                .filter(s =&gt; classFilter === &#x27;ALL&#x27; || s.classe === classFilter)
                .sort((a,b) =&gt; a.classe === b.classe ? a.name.localeCompare(b.name) : a.classe.localeCompare(b.classe));

            list.forEach(s =&gt; {
                const sc = calcScores(s);
                const slotOf = SLOTS.find(k =&gt; group[k] === s.id);
                const labels = { r1: &#x27;🏃 C1&#x27;, s1: &#x27;👁️ O1&#x27;, r2: &#x27;🏃 C2&#x27;, s2: &#x27;👁️ O2&#x27; };
                const div = document.createElement(&#x27;div&#x27;);
                div.className = `student-card ${slotOf ? &#x27;selected&#x27; : &#x27;&#x27;} ${sc.total16 &gt; 0 ? &#x27;done&#x27; : &#x27;&#x27;}`;
                div.innerHTML = `
                    ${slotOf ? `&lt;div class=&quot;card-badge&quot;&gt;${labels[slotOf]}&lt;/div&gt;` : &#x27;&#x27;}
                    &lt;div class=&quot;card-class ${s.classe === &#x27;5B&#x27; ? &#x27;c-5b&#x27; : &#x27;c-5c&#x27;}&quot;&gt;${s.classe}&lt;/div&gt;
                    &lt;div class=&quot;card-sex ${s.sex === &#x27;F&#x27; ? &#x27;sex-f&#x27; : &#x27;sex-g&#x27;}&quot; onclick=&quot;toggleSexCard(event, ${s.id})&quot;&gt;${s.sex}&lt;/div&gt;

                div.onclick = () =&gt; selectStudent(s.id);
                grid.appendChild(div);
            });
            updateSlotsUI();

        function toggleSexCard(e, id) {
            e.stopPropagation();
            const s = students.find(x =&gt; x.id === id);
            if (!s) return;
            s.sex = s.sex === &#x27;G&#x27; ? &#x27;F&#x27; : &#x27;G&#x27;;
            syncStudent(s);
            renderHome();
        }

        function selectStudent(id) {
            const existing = SLOTS.find(k =&gt; group[k] === id);
            if (existing &amp;&amp; existing !== activeSlot) return;
            if (group[activeSlot] === id) {
                group[activeSlot] = null;
            } else {
                group[activeSlot] = id;
                const start = SLOTS.indexOf(activeSlot);
                for (let i = 1; i &lt;= SLOTS.length; i++) {
                    const next = SLOTS[(start + i) % SLOTS.length];
                    if (!group[next]) { activeSlot = next; break; }
                }
            }
            renderHome();
        }

        function focusSlot(slot) { activeSlot = slot; renderHome(); }
        function removeSlot(slot, e) { e.stopPropagation(); group[slot] = null; activeSlot = slot; renderHome(); }

        function updateSlotsUI() {
            SLOTS.forEach(k =&gt; {
                const el = document.getElementById(&#x27;slot-&#x27; + k);
                const nameEl = document.getElementById(&#x27;name-&#x27; + k);
                el.classList.toggle(&#x27;active&#x27;, activeSlot === k);
                const s = group[k] ? students.find(x =&gt; x.id === group[k]) : null;
                el.classList.toggle(&#x27;filled&#x27;, Boolean(s));
                nameEl.textContent = s ? s.name : &#x27;Choisir...&#x27;;
            });
            const p1Ok = Boolean(group.r1 &amp;&amp; group.s1);
            const p1Part = Boolean((group.r1 || group.s1) &amp;&amp; !p1Ok);
            const p2Ok = Boolean(group.r2 &amp;&amp; group.s2);
            const p2Part = Boolean((group.r2 || group.s2) &amp;&amp; !p2Ok);
            document.getElementById(&#x27;btn-launch&#x27;).style.display = ((p1Ok || p2Ok) &amp;&amp; !p1Part &amp;&amp; !p2Part) ? &#x27;inline-flex&#x27; : &#x27;none&#x27;;
        }

        function getActivePairs() {
            const pairs = [];
            if (group.r1 &amp;&amp; group.s1) pairs.push({ r: &#x27;r1&#x27;, s: &#x27;s1&#x27; });
            if (group.r2 &amp;&amp; group.s2) pairs.push({ r: &#x27;r2&#x27;, s: &#x27;s2&#x27; });
            return pairs;
        }

        // ================= EVALUATION =================
        function startEvaluation() {
            const pairs = getActivePairs();
            if (!pairs.length) return;
            pairs.forEach(p =&gt; {
                const runner = students.find(x =&gt; x.id === group[p.r]);
                const obs = students.find(x =&gt; x.id === group[p.s]);
                if (runner &amp;&amp; obs) { runner.observer = obs.name; syncStudent(runner); }
            });
            currentRunnerId = group[pairs[0].r];
            activePeriod9 = 0;
            activePeriod3 = 0;
            setMobilePhase(&#x27;velo&#x27;);
            document.getElementById(&#x27;screen-home&#x27;).style.display = &#x27;none&#x27;;
            document.getElementById(&#x27;screen-eval&#x27;).style.display = &#x27;flex&#x27;;
            renderEval();
        }

            document.getElementById(&#x27;screen-home&#x27;).style.display = &#x27;flex&#x27;;
            renderHome();
        }

        function swapRoles() {
            const pairs = getActivePairs();
            if (!pairs.length) return;
            if (!confirm(&quot;🔄 Inverser les rôles ? Les observateurs deviennent les coureurs !&quot;)) return;
            let nextId = null;
            pairs.forEach(p =&gt; {
                const oldR = group[p.r], oldS = group[p.s];
                group[p.r] = oldS; group[p.s] = oldR;
                if (currentRunnerId === oldR) nextId = oldS;
                const runner = students.find(x =&gt; x.id === group[p.r]);
                const obs = students.find(x =&gt; x.id === group[p.s]);
                if (runner &amp;&amp; obs) { runner.observer = obs.name; syncStudent(runner); }
            });
            currentRunnerId = nextId || group[pairs[0].r];
            activePeriod9 = 0;
            activePeriod3 = 0;
            setMobilePhase(&#x27;velo&#x27;);
            renderEval();
        }

        function switchRunner(id) {
            currentRunnerId = id;
            activePeriod9 = 0;
            activePeriod3 = 0;
            renderEval();
        }

        function renderEval() {
            const pairs = getActivePairs();
            const tabs = document.getElementById(&#x27;runner-tabs&#x27;);
            tabs.innerHTML = &#x27;&#x27;;
            pairs.forEach(p =&gt; {
                const r = students.find(x =&gt; x.id === group[p.r]);
                if (!r) return;
                const sc = calcScores(r);
                const btn = document.createElement(&#x27;button&#x27;);
                btn.className = `runner-tab ${r.id === currentRunnerId ? &#x27;active&#x27; : &#x27;&#x27;}`;
                btn.onclick = () =&gt; switchRunner(r.id);
                btn.innerHTML = `
                    &lt;div class=&quot;tab-info&quot;&gt;
                        &lt;div class=&quot;tab-main&quot;&gt;🏃 ${r.name} (${r.sex})&lt;/div&gt;

                    &lt;/div&gt;
                    &lt;strong style=&quot;color:#047857; font-size:0.88rem; flex-shrink:0;&quot;&gt;${sc.isComplete20 ? sc.total20 + &#x27;/20&#x27; : sc.total16 + &#x27;/16&#x27;}&lt;/strong&gt;
                `;
                tabs.appendChild(btn);
            });

            const s = students.find(x =&gt; x.id === currentRunnerId);
            if (!s) return;
            const sc = calcScores(s);

            document.getElementById(&#x27;vma-hint&#x27;).textContent = `VMA ${s.vma}`;
            document.getElementById(&#x27;input-p9&#x27;).value = s.p9;
            document.getElementById(&#x27;input-p3&#x27;).value = s.p3;
            document.getElementById(&#x27;btn-toggle-sex&#x27;).textContent = s.sex === &#x27;F&#x27; ? &#x27;Fille&#x27; : &#x27;Garçon&#x27;;

            // Périodes 9&#x27;
            const p9Wrap = document.getElementById(&#x27;periods-9&#x27;);
            p9Wrap.innerHTML = &#x27;&#x27;;
            PERIOD_LABELS_9.forEach((lbl, idx) =&gt; {
                const val = s.plots9[idx] || 0;
                const key = `9-${idx}`;
                const card = document.createElement(&#x27;div&#x27;);
                card.className = `period-card ${activePeriod9 === idx ? &#x27;active-velo&#x27; : &#x27;&#x27;}`;
                card.onclick = () =&gt; { activePeriod9 = idx; renderEval(); };
                card.innerHTML = `
                    &lt;div class=&quot;period-head&quot;&gt;&lt;span&gt;P${idx+1} • ${lbl}&lt;/span&gt;&lt;span&gt;${val} km/h&lt;/span&gt;&lt;/div&gt;
                    &lt;div class=&quot;period-controls&quot;&gt;
                        &lt;button class=&quot;btn-step&quot; onclick=&quot;stepPlot(event, 9, ${idx}, -1)&quot;&gt;−&lt;/button&gt;
                        &lt;input type=&quot;number&quot; min=&quot;0&quot; max=&quot;30&quot; class=&quot;period-val ${lastPopKey === key ? &#x27;pop-anim&#x27; : &#x27;&#x27;}&quot; value=&quot;${val}&quot;
                            onclick=&quot;event.stopPropagation(); activePeriod9=${idx};&quot;
                            onchange=&quot;setPlot(9, ${idx}, this.value)&quot;&gt;
                        &lt;button class=&quot;btn-step&quot; onclick=&quot;stepPlot(event, 9, ${idx}, 1)&quot;&gt;+&lt;/button&gt;
                    &lt;/div&gt;
                `;
                p9Wrap.appendChild(card);
            });
            document.getElementById(&#x27;btn-plus-9&#x27;).textContent = `+ 1 PLOT • P${activePeriod9+1} (${PERIOD_LABELS_9[activePeriod9]})`;

            // Périodes 3&#x27;
            const p3Wrap = document.getElementById(&#x27;periods-3&#x27;);
            p3Wrap.innerHTML = &#x27;&#x27;;
            PERIOD_LABELS_3.forEach((lbl, idx) =&gt; {
                const val = s.plots3[idx] || 0;
                const key = `3-${idx}`;
                const card = document.createElement(&#x27;div&#x27;);
                card.className = `period-card ${activePeriod3 === idx ? &#x27;active-moto&#x27; : &#x27;&#x27;}`;
                card.onclick = () =&gt; { activePeriod3 = idx; renderEval(); };
                card.innerHTML = `
                    &lt;div class=&quot;period-head&quot;&gt;&lt;span&gt;P${idx+1} • ${lbl}&lt;/span&gt;&lt;span&gt;${val} km/h&lt;/span&gt;&lt;/div&gt;
                    &lt;div class=&quot;period-controls&quot;&gt;
                        &lt;button class=&quot;btn-step&quot; onclick=&quot;stepPlot(event, 3, ${idx}, -1)&quot;&gt;−&lt;/button&gt;
                        &lt;input type=&quot;number&quot; min=&quot;0&quot; max=&quot;30&quot; class=&quot;period-val ${lastPopKey === key ? &#x27;pop-anim&#x27; : &#x27;&#x27;}&quot; value=&quot;${val}&quot;
                            onclick=&quot;event.stopPropagation(); activePeriod3=${idx};&quot;
                            onchange=&quot;setPlot(3, ${idx}, this.value)&quot;&gt;
                        &lt;button class=&quot;btn-step&quot; onclick=&quot;stepPlot(event, 3, ${idx}, 1)&quot;&gt;+&lt;/button&gt;
                    &lt;/div&gt;
                `;
                p3Wrap.appendChild(card);
            });
            document.getElementById(&#x27;btn-plus-3&#x27;).textContent = `+ 1 PLOT • P${activePeriod3+1} (${PERIOD_LABELS_3[activePeriod3]})`;
            lastPopKey = null;

            // Conseil fin de 9&#x27;
            const advBanner = document.getElementById(&#x27;advice-banner&#x27;);
            if (sc.finished9) {
                const adv = buildAdvice9(s, sc);
                document.getElementById(&#x27;advice-banner-txt&#x27;).textContent = adv.shortTxt;
                advBanner.style.display = &#x27;flex&#x27;;
            } else {
                advBanner.style.display = &#x27;none&#x27;;
            }

            // Stats &amp; couleurs des tuiles
            document.getElementById(&#x27;v9-avg-badge&#x27;).textContent = `${sc.vit9} km/h`;
            document.getElementById(&#x27;v3-avg-badge&#x27;).textContent = `${sc.vit3} km/h`;
            document.getElementById(&#x27;v9-ecart&#x27;).textContent = sc.ecart9 !== null ? `${sc.ecart9} km/h` : &#x27;--&#x27;;
            document.getElementById(&#x27;v9-reg&#x27;).textContent = `${sc.maxIdentical} / 6 id.`;
            document.getElementById(&#x27;v3-ecart&#x27;).textContent = sc.ecart3 !== null ? `${sc.ecart3} km/h` : &#x27;--&#x27;;
            document.getElementById(&#x27;v3-aug&#x27;).textContent = sc.aug !== null ? `${sc.aug &gt;= 0 ? &#x27;+&#x27; : &#x27;&#x27;}${sc.aug} km/h` : &#x27;--&#x27;;

            document.getElementById(&#x27;tile-e9&#x27;).className = &#x27;stat-tile &#x27; + (sc.ecart9 === null ? &#x27;&#x27; : sc.ecart9 &lt; 1 ? &#x27;good&#x27; : &#x27;warn&#x27;);
            document.getElementById(&#x27;tile-r9&#x27;).className = &#x27;stat-tile &#x27; + (sc.maxIdentical &gt;= 5 ? &#x27;good&#x27; : sc.maxIdentical &gt;= 3 ? &#x27;warn&#x27; : &#x27;&#x27;);
            document.getElementById(&#x27;tile-e3&#x27;).className = &#x27;stat-tile &#x27; + (sc.ecart3 === null ? &#x27;&#x27; : sc.ecart3 &lt; 1 ? &#x27;good&#x27; : &#x27;warn&#x27;);
            document.getElementById(&#x27;tile-aug&#x27;).className = &#x27;stat-tile &#x27; + (sc.aug === null ? &#x27;&#x27; : sc.aug &gt;= 1 ? &#x27;good&#x27; : sc.aug &gt;= 0.5 ? &#x27;warn&#x27; : &#x27;&#x27;);

            // Critères Colonne 3
            document.getElementById(&#x27;c-e9&#x27;).textContent = `${sc.noteEcart9} / 1,5`;
            document.getElementById(&#x27;c-r9&#x27;).textContent = `${sc.noteReg9} / 3`;
            document.getElementById(&#x27;c-p9&#x27;).textContent = `${sc.notePerf9} / 4`;
            document.getElementById(&#x27;c-e3&#x27;).textContent = `${sc.noteEcart3} / 1,5`;
            document.getElementById(&#x27;c-p3&#x27;).textContent = `${sc.notePerf3} / 4`;
            document.getElementById(&#x27;c-aug&#x27;).textContent = `${sc.noteAug} / 2`;
            document.getElementById(&#x27;c-rec&#x27;).textContent = sc.hasRecup ? `${s.recup} / 1` : `Prof (/1)`;
            document.getElementById(&#x27;c-coach&#x27;).textContent = sc.hasCoach ? `${s.coachNote} / 3` : `Prof (/3)`;

            if (sc.isComplete20) {
                document.getElementById(&#x27;live-score-main&#x27;).textContent = `${sc.total20} / 20`;
                document.getElementById(&#x27;live-score-sub&#x27;).textContent = `Note complète !`;
            } else {
                document.getElementById(&#x27;live-score-main&#x27;).textContent = `${sc.total16} / 16`;
                document.getElementById(&#x27;live-score-sub&#x27;).textContent = `+ ?/4 Prof`;
            }
        }

        function maybeTriggerAdvice9(s, course, idx) {
            if (course !== 9 || idx !== 5) return;
            const sc = calcScores(s);
            if (sc.finished9 &amp;&amp; !adviceShownFor[s.id]) {
                adviceShownFor[s.id] = true;
                openAdviceModal();
            }
        }

        function updateProjet(key, val) {
            const s = students.find(x =&gt; x.id === currentRunnerId);
            if (!s) return;
            s[key] = val;
            syncStudent(s);
            renderEval();
        }

        function stepPlot(e, course, idx, delta) {
            e.stopPropagation();
            const s = students.find(x =&gt; x.id === currentRunnerId);
            if (!s) return;
            const arr = course === 9 ? s.plots9 : s.plots3;
            arr[idx] = Math.max(0, Number(arr[idx] || 0) + delta);
            if (course === 9) activePeriod9 = idx; else activePeriod3 = idx;
            lastPopKey = `${course}-${idx}`;
            syncStudent(s);
            renderEval();
        }

        function setPlot(course, idx, val) {
            const s = students.find(x =&gt; x.id === currentRunnerId);
            if (!s) return;
            const arr = course === 9 ? s.plots9 : s.plots3;
            arr[idx] = Math.max(0, parseInt(val, 10) || 0);
            syncStudent(s);
            renderEval();
            maybeTriggerAdvice9(s, course, idx);
        }

        function addPlotActive(course) {
            const s = students.find(x =&gt; x.id === currentRunnerId);
            if (!s) return;
            if (course === 9) {
                s.plots9[activePeriod9] = Number(s.plots9[activePeriod9] || 0) + 1;
                lastPopKey = `9-${activePeriod9}`;
            } else {
                s.plots3[activePeriod3] = Number(s.plots3[activePeriod3] || 0) + 1;
                lastPopKey = `3-${activePeriod3}`;
            }
            syncStudent(s);
            renderEval();
        }

        function toggleCurrentSex() {
            const s = students.find(x =&gt; x.id === currentRunnerId);
            if (!s) return;
            s.sex = s.sex === &#x27;G&#x27; ? &#x27;F&#x27; : &#x27;G&#x27;;
            syncStudent(s);
            renderEval();
        }

        // ================= BILAN PROF (RECUP /1 &amp; COACH /3) =================
        function openBilan() {
            renderBilanTable();
            document.getElementById(&#x27;bilan-modal&#x27;).style.display = &#x27;flex&#x27;;
        }
        function closeBilan() { document.getElementById(&#x27;bilan-modal&#x27;).style.display = &#x27;none&#x27;; }

        function setProfRecup(id, val) {
            const s = students.find(x =&gt; x.id === id);
            if (!s) return;
            s.recup = (s.recup === val) ? null : val;
            syncStudent(s);
            renderBilanTable();
            renderHome();
            if (document.getElementById(&#x27;screen-eval&#x27;).style.display === &#x27;flex&#x27;) renderEval();
        }

        function setCoachNote(id, note) {
            const s = students.find(x =&gt; x.id === id);
            if (!s) return;
            s.coachNote = (s.coachNote === note) ? null : note;
            syncStudent(s);
            renderBilanTable();
            renderHome();
            if (document.getElementById(&#x27;screen-eval&#x27;).style.display === &#x27;flex&#x27;) renderEval();
        }

        function renderBilanTable() {
            const sorted = [...students].sort((a,b) =&gt; a.classe === b.classe ? a.fullName.localeCompare(b.fullName) : a.classe.localeCompare(b.classe));
            let rows = `
                &lt;tr&gt;
                    &lt;th style=&quot;text-align:left;&quot;&gt;Élève&lt;/th&gt;
                    &lt;th&gt;Cl.&lt;/th&gt;&lt;th&gt;G/F&lt;/th&gt;&lt;th&gt;Obs.&lt;/th&gt;
                    &lt;th&gt;Moy 9&#x27;&lt;/th&gt;&lt;th&gt;Moy 3&#x27;&lt;/th&gt;
                    &lt;th&gt;/16 Auto&lt;/th&gt;
                    &lt;th&gt;Récup (/1)&lt;/th&gt;
                    &lt;th&gt;Coach (/3)&lt;/th&gt;
                    &lt;th&gt;Note /20&lt;/th&gt;
                &lt;/tr&gt;
            `;
            sorted.forEach(s =&gt; {
                const sc = calcScores(s);
                rows += `
                    &lt;tr&gt;
                        &lt;td style=&quot;text-align:left; font-weight:800;&quot;&gt;${s.fullName}&lt;/td&gt;
                        &lt;td&gt;${s.classe}&lt;/td&gt;
                        &lt;td&gt;${s.sex}&lt;/td&gt;
                        &lt;td&gt;${s.observer || &#x27;-&#x27;}&lt;/td&gt;
                        &lt;td&gt;${sc.vit9}&lt;/td&gt;
                        &lt;td&gt;${sc.vit3}&lt;/td&gt;
                        &lt;td&gt;&lt;strong&gt;${sc.total16}&lt;/strong&gt;&lt;/td&gt;
                        &lt;td&gt;
                            &lt;button class=&quot;prof-btn ${s.recup === 0 ? &#x27;active-r&#x27; : &#x27;&#x27;}&quot; onclick=&quot;setProfRecup(${s.id}, 0)&quot;&gt;0&lt;/button&gt;
                            &lt;button class=&quot;prof-btn ${s.recup === 0.5 ? &#x27;active-r&#x27; : &#x27;&#x27;}&quot; onclick=&quot;setProfRecup(${s.id}, 0.5)&quot;&gt;0,5&lt;/button&gt;
                            &lt;button class=&quot;prof-btn ${s.recup === 1 ? &#x27;active-r&#x27; : &#x27;&#x27;}&quot; onclick=&quot;setProfRecup(${s.id}, 1)&quot;&gt;1&lt;/button&gt;
                        &lt;/td&gt;
                        &lt;td&gt;
                            &lt;button class=&quot;prof-btn ${s.coachNote === 1 ? &#x27;active-1&#x27; : &#x27;&#x27;}&quot; onclick=&quot;setCoachNote(${s.id}, 1)&quot;&gt;🥉 1&lt;/button&gt;
                            &lt;button class=&quot;prof-btn ${s.coachNote === 2 ? &#x27;active-2&#x27; : &#x27;&#x27;}&quot; onclick=&quot;setCoachNote(${s.id}, 2)&quot;&gt;🥈 2&lt;/button&gt;
                            &lt;button class=&quot;prof-btn ${s.coachNote === 3 ? &#x27;active-3&#x27; : &#x27;&#x27;}&quot; onclick=&quot;setCoachNote(${s.id}, 3)&quot;&gt;🥇 3&lt;/button&gt;
                        &lt;/td&gt;
                        &lt;td style=&quot;font-weight:900; color:${sc.isComplete20 ? &#x27;#059669&#x27; : &#x27;#64748b&#x27;};&quot;&gt;
                            ${sc.isComplete20 ? sc.total20 + &#x27; / 20&#x27; : &#x27;En attente&#x27;}
                        &lt;/td&gt;
                    &lt;/tr&gt;
                `;
            });
            document.getElementById(&#x27;bilan-table&#x27;).innerHTML = rows;
        }

        function exportCSV() {
            const header = &quot;Nom;Classe;Sexe;VMA;Observateur;Projet 9&#x27;;Moy 9&#x27;;Ecart 9&#x27; (/1,5);Reg 9&#x27; (/3);Perf 9&#x27; (/4);Projet 3&#x27;;Moy 3&#x27;;Ecart 3&#x27; (/1,5);Perf 3&#x27; (/4);Augm (/2);Sous-total /16;Recup /1 (Prof);Coach /3 (Prof);Note Finale /20&quot;;
            const fmt = v =&gt; (v === null || v === undefined || v === &#x27;&#x27;) ? &#x27;&#x27; : String(v).replace(&#x27;.&#x27;, &#x27;,&#x27;);
            const lines = [&quot;\uFEFF&quot; + header];
            students.forEach(s =&gt; {
                const sc = calcScores(s);
                lines.push([
                    s.fullName, s.classe, s.sex, fmt(s.vma), s.observer || &#x27;&#x27;,
                    fmt(s.p9), fmt(sc.vit9), fmt(sc.noteEcart9), fmt(sc.noteReg9), fmt(sc.notePerf9),
                    fmt(s.p3), fmt(sc.vit3), fmt(sc.noteEcart3), fmt(sc.notePerf3),
                    fmt(sc.noteAug), fmt(sc.total16), fmt(s.recup), fmt(s.coachNote), fmt(sc.total20)
                ].join(&#x27;;&#x27;));
            });
            const blob = new Blob([lines.join(&#x27;\n&#x27;)], { type: &#x27;text/csv;charset=utf-8;&#x27; });
            const a = document.createElement(&#x27;a&#x27;);
            a.href = URL.createObjectURL(blob);
            a.download = &quot;Evaluation_DemiFond_5eme_N1.csv&quot;;
            a.click();
        }

        function resetLocal() {
            if (!confirm(&quot;Effacer les données locales de cette tablette ?&quot;)) return;
            localStorage.removeItem(STORAGE_KEY);
            loadLocal();
            renderHome();
            renderBilanTable();
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() =&gt; {});
            } else if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }

        window.onload = () =&gt; {
            loadLocal();
            renderHome();
            initFirebase();
        };
    &lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;
"></iframe>
    </main>

    <script>
        function openApp(name) {
            ['montagnes', 'circuit', 'eval'].forEach(k => {
                document.getElementById('frame-' + k).classList.toggle('active', k === name);
                const btn = document.getElementById('tab-' + k);
                btn.className = 'hub-tab' + (k === name ? ' active-' + k : '');
            });
            try { localStorage.setItem('demifond_hub_last_tab', name); } catch(e) {}
        }

        function toggleFS() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            try {
                const last = localStorage.getItem('demifond_hub_last_tab');
                if (last && ['montagnes', 'circuit', 'eval'].includes(last)) openApp(last);
            } catch(e) {}
        });
    </script>
</body>
</html>
